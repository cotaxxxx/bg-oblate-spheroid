name: Meridian transverse boundary stress diagnostic

on:
  workflow_dispatch:

jobs:
  boundary-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: 835e6b5cfa2b0667f6182d9724f6bcc4a629b401
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "835e6b5cfa2b0667f6182d9724f6bcc4a629b401"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: |
          python -m pip install mpmath==1.4.1
          python -m pip install numpy==2.1.3
      - name: Run boundary stress scan
        run: PYTHONPATH=. python analysis/meridian_transverse_boundary_stress.py
