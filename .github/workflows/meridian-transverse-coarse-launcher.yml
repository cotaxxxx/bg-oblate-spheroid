name: Meridian transverse coarse diagnostic launcher

"on":
  workflow_dispatch:

jobs:
  coarse-transverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: 143b2e3b72442eb48c4cde503da1abf93663c4a3
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "143b2e3b72442eb48c4cde503da1abf93663c4a3"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: |
          python -m pip install mpmath==1.4.1
          python -m pip install numpy==2.1.3
      - name: Run coarse transverse scan
        run: PYTHONPATH=. python analysis/meridian_transverse_coarse.py
