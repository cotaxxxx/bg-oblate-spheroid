name: Meridian transverse coarse diagnostic launcher

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 143b2e3b72442eb48c4cde503da1abf93663c4a3

jobs:
  coarse-transverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Record checked-out source SHA
        run: |
          echo "DECLARED_SOURCE_SHA=${SOURCE_SHA}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install --only-binary=:all: mpmath==1.4.1 numpy==2.1.3
      - name: Run coarse transverse scan
        run: PYTHONPATH=. python analysis/meridian_transverse_coarse.py
