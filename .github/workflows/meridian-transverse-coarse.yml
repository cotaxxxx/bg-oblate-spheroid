name: Meridian transverse coarse diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coarse-transverse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --only-binary=:all: mpmath==1.4.1 numpy==2.1.3
      - name: Run coarse transverse scan
        run: PYTHONPATH=. python analysis/meridian_transverse_coarse.py
